<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Assignment</title>

    <link href="https://cdn.lineicons.com/3.0/lineicons.css" rel="stylesheet" />


    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="demo-section">
        <h3>2. Custom Button</h3>
        <div class="button-container">
            <p>Enabled / Hover / Active states:</p>
            <button id="action-update" type="button">
                <span class="lni lni-checkmark-circle"></span>
                <span>Update</span>
            </button>

            <p>Disabled state:</p>
            <button id="action-update" type="button" disabled>
                <span class="lni lni-checkmark-circle"></span>
                <span>Update</span>
            </button>
        </div>
    </section>

    <section class="demo-section">
        <h3>3. Custom Radio Group</h3>
        <label for="hero-level" class="main-label">Level<abbr title="required">*</abbr></label>
        <fieldset id="hero-level">
            <input type="radio" id="hero-level-junior" name="level" value="Junior" />
            <label for="hero-level-junior">jr.</label>

            <input type="radio" id="hero-level-middle" name="level" value="Middle" />
            <label for="hero-level-middle">mid.</label>

            <input type="radio" id="hero-level-senior" name="level" value="Senior" />
            <label for="hero-level-senior">snr.</label>
        </fieldset>
    </section>


    <h3>4 & 5. Responsive Layouts</h3>
    <p>Resize the window to toggle between Layout 1, 2, and 3.</p>

    <div class="layout-container">
        <div class="box box-1">1</div>
        <div class="box box-A">A</div>
        <div class="box box-B1">B1</div>
        <div class="box box-B2">B2</div>
        <div class="box box-2">2</div>
    </div>

</body>

</html>
