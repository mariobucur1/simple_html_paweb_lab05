<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons in Layout</title>
    <link href="https://cdn.lineicons.com/3.0/lineicons.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="layout-container">

        <div class="box box-1">1 - Header</div>


        <div class="box box-A">
            <div class="content-wrapper">
                <p>Main Action Area (A)</p>
                <button id="action-update" type="button">
                    <span class="lni lni-checkmark-circle"></span>
                    <span>Update</span>
                </button>
            </div>
        </div>


        <div class="box box-B1">
            <div class="content-wrapper">
                <label for="hero-level" class="main-label">Level<abbr title="required">*</abbr></label>
                <fieldset id="hero-level">
                    <input type="radio" id="hero-level-jr" name="lvl" value="Jr" />
                    <label for="hero-level-jr">jr.</label>
                    <input type="radio" id="hero-level-mid" name="lvl" value="Mid" />
                    <label for="hero-level-mid">mid.</label>
                    <input type="radio" id="hero-level-mid" name="lvl" value="Mid" />
                    <label for="hero-level-mid">snr.</label>
                </fieldset>
            </div>
        </div>


        <div class="box box-B2">
            <div class="content-wrapper">
                <p>Secondary Area (B2)</p>
                <button id="action-update" type="button" disabled>
                    <span class="lni lni-checkmark-circle"></span>
                    <span>Update</span>
                </button>
            </div>
        </div>


        <div class="box box-2">2 - Footer</div>
    </div>

</body>

</html>
